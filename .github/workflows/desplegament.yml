# Desplegament manual a Cloudflare (staging o producció).
# Requereix els secrets del repositori CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID
# i els database_id reals a wrangler.jsonc (vegeu README, «Desplegament»).
name: Desplegament

on:
  workflow_dispatch:
    inputs:
      entorn:
        description: "Entorn de destinació"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: desplegament-${{ inputs.entorn }}
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # Els entorns de GitHub permeten exigir aprovació manual abans de producció.
    environment: ${{ inputs.entorn }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: ${{ inputs.entorn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Punt de restauració abans de migrar (D1 Time Travel; vegeu docs/operacions.md).
      - run: npx wrangler d1 time-travel info DB --env "$CLOUDFLARE_ENV"
      - run: npx wrangler d1 migrations apply DB --remote --env "$CLOUDFLARE_ENV"
      # CLOUDFLARE_ENV fa que el plugin de Vite generi la configuració de l'entorn triat.
      - run: npx vite build
      - id: desplegament
        run: |
          npx wrangler deploy | tee "$RUNNER_TEMP/deploy.log"
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)" >> "$GITHUB_OUTPUT"
      # Clau per xifrar els testimonis d'Instagram dels casals (docs/instagram.md). Es crea una
      # sola vegada; si ja existeix no es toca (canviar-la obligaria a tornar a connectar els comptes).
      # El valor no es mostra mai al registre.
      - name: Secret d'Instagram
        run: |
          # Si no es pot llegir la llista, s'atura: mai es crea una clau nova a cegues.
          secrets="$(npx wrangler secret list --env "$CLOUDFLARE_ENV")"
          if grep -qw 'INSTAGRAM_CLAU' <<< "$secrets"; then
            echo "INSTAGRAM_CLAU ja existeix."
          else
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put INSTAGRAM_CLAU --env "$CLOUDFLARE_ENV" > /dev/null
            echo "S'ha creat INSTAGRAM_CLAU."
          fi
      # Comprovació final: el Worker respon i arriba a la base de dades.
      - name: Comprovació de salut
        if: steps.desplegament.outputs.url != ''
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ steps.desplegament.outputs.url }}/api/salut" | tee /dev/stderr | grep -q '"estat":"ok"'; then exit 0; fi
            sleep 5
          done
          echo "El desplegament no respon correctament a /api/salut." >&2
          exit 1
